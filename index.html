<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahya Sameeh P P — Portfolio</title>
  <meta name="description" content="Ultra-dark minimalist personal portfolio of Yahya Sameeh P P. Systems builder, developer, and cybersecurity researcher based in Malappuram, Kerala.">
  <meta name="theme-color" content="#080808">

  <!-- OpenGraph -->
  <meta property="og:title" content="Yahya Sameeh P P — Portfolio">
  <meta property="og:description" content="Ultra-dark minimalist bento-grid portfolio of Yahya Sameeh P P.">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#080808',
              card: '#121214',
              hover: '#161619',
              border: 'rgba(255, 255, 255, 0.08)',
              borderHover: 'rgba(255, 255, 255, 0.18)',
              muted: '#8e8e93',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          screens: {
            'xs': '480px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
            '3xl': '1720px',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#080808] text-[#f5f5f7] min-h-screen flex flex-col justify-between selection:bg-white/20 selection:text-white">
  <!-- Subtle Film Grain Overlay -->
  <div class="film-grain"></div>

  <!-- Persistent Top Header (Minimalist 2-Element Layout) -->
  <header class="sticky top-0 z-50 w-full glass-header px-4 sm:px-8 lg:px-12 xl:px-16 py-3.5 sm:py-4 transition-all duration-300">
    <div class="max-w-[1720px] mx-auto flex items-center justify-between text-xs tracking-tight text-[#8e8e93]">
      <!-- Left: Identity -->
      <a href="index.html" class="font-medium text-[#f5f5f7] hover:text-white transition-colors text-xs sm:text-sm">
        Yahya Sameeh P P
      </a>

      <!-- Right: Location & Live Local Time Indicator -->
      <div class="flex items-center gap-2 font-mono text-[11px] sm:text-xs">
        <span class="text-[#a1a1aa] hidden xs:inline">Malappuram, Kerala •</span>
        <span class="live-time-display text-[#f5f5f7] font-medium min-w-[65px] text-right">10:30 PM</span>
        <div class="pulse-indicator ml-1" title="Active in Malappuram, Kerala, India">
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Hero & Extended Bento Grid Container -->
  <main class="w-full max-w-[1720px] mx-auto px-4 sm:px-8 lg:px-12 xl:px-16 2xl:px-20 pt-6 sm:pt-10 lg:pt-12 pb-14 sm:pb-20 flex-1 flex flex-col justify-center relative page-fade-in">
    
    <!-- Hero Giant Typography & Dynamic Interactive Title Section -->
    <div class="relative w-full overflow-hidden select-none pb-2 sm:pb-4 flex justify-center items-center">
      <h1 id="heroDisplayTitle" class="hero-giant-title hero-title-mask tracking-tight uppercase">
        YAHYA SAMEEH PP
      </h1>
      <!-- Frosted blur gradient mask so extended cards overlap seamlessly -->
      <div class="hero-mask-gradient"></div>
    </div>

    <!-- =========================================================================
         EXTENDED BENTO GRID LAYOUT:
         - Picture sections reveal above text on hover for About, Portfolio, Contact, Resume
         - Photo card writes "I am Yahya Sameeh P P" on cursor hover
         ========================================================================= -->
    <div class="grid grid-cols-1 md:grid-cols-6 lg:grid-cols-12 gap-4 sm:gap-5 lg:gap-6 relative z-10 -mt-6 sm:-mt-10 lg:-mt-14">

      <!-- ----------------------------------------------------
           ROW 1: About & Portfolio
           ---------------------------------------------------- -->
      
      <!-- Bento Card 1: About -->
      <a 
        href="about.html" 
        data-nav 
        data-hero-title="ABOUT // YAHYA SAMEEH"
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-4 p-5 sm:p-7 lg:p-8 xl:p-9 flex flex-col justify-between h-52 sm:h-64 md:h-72 lg:h-[340px] xl:h-[390px] 2xl:h-[430px]"
      >
        <!-- Picture Section (Reveals on Hover) -->
        <div class="w-full flex-1 rounded-2xl overflow-hidden relative mb-4 opacity-0 group-hover:opacity-100 transition-all duration-500 transform group-hover:scale-[1.01] bg-black/40 border border-white/[0.04]">
          <img 
            src="assets/images/cyber_sec.jpg" 
            alt="About Visual Preview" 
            class="w-full h-full object-cover grayscale contrast-125 brightness-90 group-hover:scale-105 transition-transform duration-700"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-[#121214] via-transparent to-transparent"></div>
        </div>

        <!-- Bottom Label & Arrow -->
        <div class="flex items-center justify-between w-full pt-1">
          <span class="text-lg sm:text-xl lg:text-2xl font-medium tracking-tight text-[#f5f5f7]">About</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </span>
        </div>
      </a>

      <!-- Bento Card 2: Portfolio (Wide Extended Card) -->
      <a 
        href="portfolio.html" 
        data-nav 
        data-hero-title="PORTFOLIO // SELECTED WORK"
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-8 p-5 sm:p-7 lg:p-8 xl:p-9 flex flex-col justify-between h-52 sm:h-64 md:h-72 lg:h-[340px] xl:h-[390px] 2xl:h-[430px]"
      >
        <!-- Picture Section (Reveals on Hover) -->
        <div class="w-full flex-1 rounded-2xl overflow-hidden relative mb-4 opacity-0 group-hover:opacity-100 transition-all duration-500 transform group-hover:scale-[1.01] bg-black/40 border border-white/[0.04]">
          <img 
            src="assets/images/api_lab.jpg" 
            alt="Portfolio Visual Mockup" 
            class="w-full h-full object-cover contrast-110 brightness-95 group-hover:scale-105 transition-transform duration-700"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-[#121214] via-transparent to-transparent"></div>
        </div>

        <!-- Bottom Label & Arrow -->
        <div class="flex items-center justify-between w-full pt-1">
          <span class="text-lg sm:text-xl lg:text-2xl font-medium tracking-tight text-[#f5f5f7]">Portfolio</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </span>
        </div>
      </a>

      <!-- ----------------------------------------------------
           ROW 2: Contact, Portrait, Tech Stack & Resume
           ---------------------------------------------------- -->

      <!-- Bento Card 3: Contact (Wide Extended Card) -->
      <a 
        href="contact.html" 
        data-nav 
        data-hero-title="CONTACT // LET'S TALK"
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-5 p-5 sm:p-7 lg:p-8 xl:p-9 flex flex-col justify-between h-52 sm:h-72 md:h-80 lg:h-[350px] xl:h-[400px] 2xl:h-[440px]"
      >
        <!-- Picture Section (Reveals on Hover) -->
        <div class="w-full flex-1 rounded-2xl overflow-hidden relative mb-4 opacity-0 group-hover:opacity-100 transition-all duration-500 transform group-hover:scale-[1.01] bg-gradient-to-br from-[#18181c] to-[#0f0f11] border border-white/[0.06] flex items-center justify-center p-6">
          <div class="flex flex-col items-center justify-center gap-3 text-center">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
              <i data-lucide="send" class="w-6 h-6"></i>
            </div>
            <span class="text-xs sm:text-sm font-mono text-[#a1a1aa]">yahyasameeh1111@gmail.com</span>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-[#121214] via-transparent to-transparent"></div>
        </div>

        <!-- Bottom Label & Arrow -->
        <div class="flex items-center justify-between w-full pt-1">
          <span class="text-lg sm:text-xl lg:text-2xl font-medium tracking-tight text-[#f5f5f7]">Contact</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </span>
        </div>
      </a>

      <!-- Bento Card 4: Portrait / Visual (Photo of me with Interactive Hover Text) -->
      <div 
        id="portraitCard"
        data-hero-title="I AM YAHYA SAMEEH PP"
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-3 h-72 sm:h-80 md:h-80 lg:h-[350px] xl:h-[400px] 2xl:h-[440px] relative p-0 overflow-hidden bg-black flex items-center justify-center cursor-pointer"
      >
        <img 
          src="assets/images/portrait.jpg" 
          alt="Yahya Sameeh P P" 
          class="w-full h-full object-cover grayscale contrast-125 brightness-95 group-hover:scale-105 group-hover:brightness-105 transition-all duration-700 ease-out"
        />
        <!-- Subtle dark vignette overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/20 pointer-events-none"></div>

        <!-- Hover Reveal: Writes "I am Yahya Sameeh P P" -->
        <div class="absolute inset-0 bg-black/45 backdrop-blur-[3px] opacity-0 group-hover:opacity-100 transition-all duration-400 flex items-center justify-center p-6 text-center">
          <div class="transform translate-y-3 group-hover:translate-y-0 transition-transform duration-400 space-y-2">
            <p class="text-base sm:text-lg lg:text-xl font-bold tracking-tight text-white drop-shadow-md">
              I am Yahya Sameeh P P
            </p>
            <span class="text-xs font-mono text-emerald-400 block">
              ● Active in Malappuram
            </span>
          </div>
        </div>
      </div>

      <!-- Bento Right Column: Split into Tech Squircles & Resume -->
      <div class="col-span-1 md:col-span-6 lg:col-span-4 grid grid-cols-2 lg:grid-cols-1 gap-4 sm:gap-5 lg:gap-6 h-auto lg:h-[350px] xl:h-[400px] 2xl:h-[440px]">

        <!-- Bento Card 5: Tooling / Tech Squircles (Top Card) -->
        <div class="bento-card p-4 sm:p-6 lg:p-6 flex items-center justify-center gap-3.5 sm:gap-5 lg:gap-6 h-40 sm:h-44 lg:h-[165px] xl:h-[190px] 2xl:h-[210px]">
          <!-- Tool Squircle 1: Supabase / Database -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-emerald-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Supabase">
            <i data-lucide="database" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <!-- Tool Squircle 2: Kali Linux / Security -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-blue-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Cybersecurity & Network Auditing">
            <i data-lucide="shield" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <!-- Tool Squircle 3: Code / JavaScript / C++ -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-amber-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="JavaScript & Systems">
            <i data-lucide="code-2" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
          <!-- Tool Squircle 4: Netlify / Cloud -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-cyan-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Netlify Cloud Deployment">
            <i data-lucide="cloud" class="w-5 h-5 sm:w-6 sm:h-6"></i>
          </div>
        </div>

        <!-- Bento Card 6: Resume (Bottom Card) -->
        <a 
          href="resume.html" 
          data-nav 
          data-hero-title="RESUME // CURRICULUM VITAE"
          class="bento-card group p-5 sm:p-6 lg:p-7 xl:p-8 flex flex-col justify-between h-40 sm:h-44 lg:h-[165px] xl:h-[190px] 2xl:h-[210px]"
        >
          <!-- Picture Section (Reveals on Hover) -->
          <div class="w-full flex-1 rounded-xl overflow-hidden relative mb-2 opacity-0 group-hover:opacity-100 transition-all duration-500 transform group-hover:scale-[1.01] bg-gradient-to-br from-[#18181c] to-[#0f0f11] border border-white/[0.06] flex items-center justify-center px-3 py-1">
            <div class="flex items-center gap-2 text-xs font-mono text-[#a1a1aa]">
              <i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i>
              <span>Curriculum Vitae</span>
            </div>
          </div>

          <!-- Bottom Label & Arrow -->
          <div class="flex items-center justify-between w-full pt-1">
            <span class="text-lg sm:text-xl lg:text-2xl font-medium tracking-tight text-[#f5f5f7]">Resume</span>
            <span class="arrow-icon">
              <i data-lucide="arrow-up-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
            </span>
          </div>
        </a>

      </div>

    </div>

  </main>

  <!-- Universal Minimal Footer -->
  <footer class="w-full border-t border-white/[0.05] bg-[#080808]/90 py-6 sm:py-7 px-4 sm:px-8 lg:px-12 xl:px-16">
    <div class="max-w-[1720px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 text-xs text-[#71717a]">
      <!-- Direct Contact Links -->
      <div class="flex items-center gap-5 sm:gap-6 flex-wrap justify-center">
        <a href="mailto:yahyasameeh1111@gmail.com" class="hover:text-white transition-colors">yahyasameeh1111@gmail.com</a>
        <a href="https://github.com/yahyasameeh1111" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors flex items-center gap-1">
          GitHub <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
        </a>
        <a href="https://www.instagram.com/yyeyy_yyaaa/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors flex items-center gap-1">
          Instagram <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
        </a>
      </div>

      <!-- Copyright -->
      <div class="font-mono text-[11px] text-[#52525b]">
        © 2026 Yahya Sameeh P P. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
