<!DOCTYPE html>

  <header class="w-full glass-header px-4 sm:px-6 lg:px-8 py-2 sm:py-2.5 transition-all duration-300 z-50 flex-shrink-0">
    <div class="w-full flex items-center justify-between text-xs tracking-tight text-[#8e8e93]">
