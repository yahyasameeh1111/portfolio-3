<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahya Sameeh P P — Web Developer & Cybersecurity Enthusiast</title>
  <meta name="description" content="Ultra-dark minimalist personal portfolio of Yahya Sameeh P P. Web developer, cybersecurity enthusiast, and systems builder based in Edappatta, Kerala.">
  <meta name="theme-color" content="#080808">

  <!-- OpenGraph -->
  <meta property="og:title" content="Yahya Sameeh P P — Portfolio">
  <meta property="og:description" content="Ultra-dark minimalist bento-grid portfolio. Web developer & cybersecurity enthusiast.">
  <meta property="og:type" content="website">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#080808',
              card: '#121214',
              hover: '#161619',
              border: 'rgba(255, 255, 255, 0.08)',
              borderHover: 'rgba(255, 255, 255, 0.18)',
              muted: '#8e8e93',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          screens: {
            'xs': '480px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1440px',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-[#080808] text-[#f5f5f7] min-h-screen flex flex-col justify-between selection:bg-white/20 selection:text-white">
  <!-- Subtle Film Grain Overlay -->
  <div class="film-grain"></div>

  <!-- Persistent Top Header -->
  <header class="sticky top-0 z-50 w-full glass-header px-4 sm:px-8 py-3.5 sm:py-4 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between text-xs tracking-tight text-[#8e8e93]">
      <!-- Left: Identity -->
      <a href="index.html" class="font-medium text-[#f5f5f7] hover:text-white transition-colors text-xs sm:text-sm">
        Yahya Sameeh P P
      </a>

      <!-- Center: Role (Hidden on mobile/tablet for clean minimalist top bar) -->
      <div class="hidden lg:block font-normal text-[#a1a1aa] tracking-normal text-xs sm:text-sm">
        Web Developer & Cybersecurity Enthusiast
      </div>

      <!-- Right: Location & Live Local Time Indicator -->
      <div class="flex items-center gap-2 font-mono text-[11px] sm:text-xs">
        <span class="text-[#a1a1aa] hidden xs:inline">Edappatta •</span>
        <span class="live-time-display text-[#f5f5f7] font-medium min-w-[65px] text-right">10:30 PM</span>
        <div class="pulse-indicator ml-1" title="Active in Kerala, India">
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Hero & Clean Bento Grid Container -->
  <main class="w-full max-w-6xl 2xl:max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-10 lg:pt-12 pb-12 sm:pb-16 flex-1 flex flex-col justify-center relative page-fade-in">
    
    <!-- Hero Giant Typography with Soft Blur Layering -->
    <div class="relative w-full overflow-hidden select-none pb-2 sm:pb-4 flex justify-center">
      <h1 class="hero-giant-title hero-title-mask tracking-tight">
        Yahya Sameeh
      </h1>
      <!-- Frosted blur gradient mask so cards overlap seamlessly -->
      <div class="hero-mask-gradient"></div>
    </div>

    <!-- =========================================================================
         BENTO GRID LAYOUT SYSTEM:
         - Mobile (<768px): Single column / paired cards, compact & thumb-friendly
         - Tablet (768px - 1023px): 6-column balanced layout
         - Laptop & Desktop (1024px+): Exact 12-column high-end design matching sample
         ========================================================================= -->
    <div class="grid grid-cols-1 md:grid-cols-6 lg:grid-cols-12 gap-3.5 sm:gap-4 lg:gap-5 relative z-10 -mt-6 sm:-mt-10 lg:-mt-14">

      <!-- ----------------------------------------------------
           ROW 1: About & Portfolio
           ---------------------------------------------------- -->
      
      <!-- Bento Card 1: About -->
      <!-- Mobile: full-width / Tablet: 3 cols / Laptop: 4 cols -->
      <a 
        href="about.html" 
        data-nav 
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-4 p-5 sm:p-7 lg:p-8 flex flex-col justify-end h-44 sm:h-56 lg:h-[270px]"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-base sm:text-lg lg:text-xl font-medium tracking-tight text-[#f5f5f7]">About</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </span>
        </div>
      </a>

      <!-- Bento Card 2: Portfolio (Wide Card) -->
      <!-- Mobile: full-width / Tablet: 3 cols / Laptop: 8 cols -->
      <a 
        href="portfolio.html" 
        data-nav 
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-8 p-5 sm:p-7 lg:p-8 flex flex-col justify-end h-44 sm:h-56 lg:h-[270px]"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-base sm:text-lg lg:text-xl font-medium tracking-tight text-[#f5f5f7]">Portfolio</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </span>
        </div>
      </a>

      <!-- ----------------------------------------------------
           ROW 2: Contact, Portrait, Tech Stack & Resume
           ---------------------------------------------------- -->

      <!-- Bento Card 3: Contact (Wide Card) -->
      <!-- Mobile: full-width / Tablet: 3 cols / Laptop: 5 cols -->
      <a 
        href="contact.html" 
        data-nav 
        class="bento-card group col-span-1 md:col-span-3 lg:col-span-5 p-5 sm:p-7 lg:p-8 flex flex-col justify-end h-44 sm:h-64 lg:h-[280px]"
      >
        <div class="flex items-center justify-between w-full">
          <span class="text-base sm:text-lg lg:text-xl font-medium tracking-tight text-[#f5f5f7]">Contact</span>
          <span class="arrow-icon">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </span>
        </div>
      </a>

      <!-- Bento Card 4: Portrait / Visual (Vertical Monochromatic Frame) -->
      <!-- Mobile: full-width / Tablet: 3 cols / Laptop: 3 cols -->
      <div class="bento-card group col-span-1 md:col-span-3 lg:col-span-3 h-64 sm:h-64 lg:h-[280px] relative p-0 overflow-hidden bg-black flex items-center justify-center">
        <img 
          src="assets/images/portrait.jpg" 
          alt="Yahya Sameeh P P" 
          class="w-full h-full object-cover grayscale contrast-125 brightness-95 group-hover:scale-105 group-hover:brightness-105 transition-all duration-700 ease-out"
        />
        <!-- Subtle dark vignette overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-black/20 pointer-events-none"></div>
      </div>

      <!-- Bento Right Column: Split into Tech Squircles & Resume -->
      <!-- Mobile: full-width (2 cols grid) / Tablet: 6 cols (2 cols grid) / Laptop: 4 cols (stacked) -->
      <div class="col-span-1 md:col-span-6 lg:col-span-4 grid grid-cols-2 lg:grid-cols-1 gap-3.5 sm:gap-4 lg:gap-5 h-auto lg:h-[280px]">

        <!-- Bento Card 5: Tooling / Tech Squircles (Top Card) -->
        <div class="bento-card p-4 sm:p-5 flex items-center justify-center gap-3 sm:gap-4 h-36 sm:h-40 lg:h-[130px]">
          <!-- Tool Squircle 1: Supabase / Database -->
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-emerald-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Supabase">
            <i data-lucide="database" class="w-5 h-5"></i>
          </div>
          <!-- Tool Squircle 2: Kali Linux / Security -->
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-blue-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Cybersecurity & Network Auditing">
            <i data-lucide="shield" class="w-5 h-5"></i>
          </div>
          <!-- Tool Squircle 3: Code / JavaScript / C++ -->
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-amber-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="JavaScript & Systems">
            <i data-lucide="code-2" class="w-5 h-5"></i>
          </div>
          <!-- Tool Squircle 4: Netlify / Cloud -->
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-[#18181b] border border-white/[0.08] flex items-center justify-center text-cyan-400 hover:border-white/25 hover:scale-105 transition-all shadow-md" title="Netlify Cloud Deployment">
            <i data-lucide="cloud" class="w-5 h-5"></i>
          </div>
        </div>

        <!-- Bento Card 6: Resume (Bottom Card) -->
        <a 
          href="resume.html" 
          data-nav 
          class="bento-card group p-5 sm:p-6 lg:p-7 flex flex-col justify-end h-36 sm:h-40 lg:h-[130px]"
        >
          <div class="flex items-center justify-between w-full">
            <span class="text-base sm:text-lg lg:text-xl font-medium tracking-tight text-[#f5f5f7]">Resume</span>
            <span class="arrow-icon">
              <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
            </span>
          </div>
        </a>

      </div>

    </div>

  </main>

  <!-- Universal Minimal Footer -->
  <footer class="w-full border-t border-white/[0.05] bg-[#080808]/90 py-5 sm:py-6 px-4 sm:px-8">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 text-xs text-[#71717a]">
      <!-- Direct Contact Links -->
      <div class="flex items-center gap-5 sm:gap-6 flex-wrap justify-center">
        <a href="mailto:yahyasameeh1111@gmail.com" class="hover:text-white transition-colors">yahyasameeh1111@gmail.com</a>
        <a href="https://github.com/yahyasameeh1111" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors flex items-center gap-1">
          GitHub <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
        </a>
        <a href="https://www.instagram.com/yyeyy_yyaaa/" target="_blank" rel="noopener noreferrer" class="hover:text-white transition-colors flex items-center gap-1">
          Instagram <i data-lucide="arrow-up-right" class="w-3 h-3"></i>
        </a>
      </div>

      <!-- Copyright -->
      <div class="font-mono text-[11px] text-[#52525b]">
        © 2026 Yahya Sameeh P P. All rights reserved.
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
